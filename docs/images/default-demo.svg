<svg xmlns="http://www.w3.org/2000/svg" width="720" height="472" viewBox="0 0 720 472" role="img" aria-labelledby="title desc">
<title id="title">Save DeepWiki once, then launch Claude normally</title>
<desc id="desc">Mock-data example from the real MCP Launcher. Save DeepWiki as the only default among three servers. A plain Claude launch selects only DeepWiki and starts a demo client.</desc>
<style>
text { font-family: monospace; font-size: 20px; }
.title { fill: #cdd6f4; font-family: sans-serif; font-size: 26px; font-weight: 600; }
.note { fill: #bac2de; font-family: sans-serif; font-size: 20px; }
.command { fill: #cdd6f4; }
.result { fill: #a6e3a1; }
</style>
<rect width="720" height="472" rx="12" fill="#1e1e2e"/>
<text x="32" y="46" class="title" xml:space="preserve">Choose once. Run as usual.</text>
<text x="32" y="78" class="note" xml:space="preserve">Example with 3 mock MCP servers and a demo client</text>
<text x="32" y="130" class="note" xml:space="preserve">1. Save DeepWiki as the default</text>
<text x="32" y="165" class="command" xml:space="preserve">$ MCP_LAUNCHER_SELECT=deepwiki \</text>
<text x="32" y="195" class="command" xml:space="preserve">  claude --mcp-default</text>
<text x="32" y="228" class="result" xml:space="preserve">claude default MCPs (1/3): deepwiki</text>
<text x="32" y="286" class="note" xml:space="preserve">2. Launch normally — no extra flag</text>
<text x="32" y="321" class="command" xml:space="preserve">$ claude</text>
<text x="32" y="354" class="result" xml:space="preserve">claude MCPs (1/3): deepwiki</text>
<text x="32" y="384" class="note" xml:space="preserve">Demo client started.</text>
<text x="32" y="438" class="note" xml:space="preserve">Only DeepWiki is selected. The other 2 MCPs stay off.</text>
</svg>
